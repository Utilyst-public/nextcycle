        - "Regional Board staff is proposing that Chorro Creek (downstream of Chorro Creek Road) be listed as impaired for dissolved oxygen. The impairment is evidenced by depressed levels of dissolved oxygen measured during pre-dawn and 24-hour sampling periods.Continuous depressed levels of dissolved oxygen (< 7.0 mg/l) were found in Chorro Creek at TWB (approximately between 12a.m-8a.m.) during three 24-hour hourly sampling periods in July, August and September 2003.  Continuous depressed levels of oxygen were also found between 5 p.m. and 7 a.m. at site added in September 2003 upstream of TWB (usTWB) (CCRWQCB, 2004o).Dissolved oxygen levels were within the COLD  water quality objective at CAN during three 24-hour hourly sampling periods in July, August and September 2003 (CCAMP, 2004).   Dissolved oxygen levels just under the COLD water quality objective (6.81-6.99 mg/l) were found during one of three sampling periods at an upstream site (CHO) in August 2003. Regional Board staff does not consider the segment upstream of CAN (and CHO) as impaired.  Regional Board staff considers the segment between usTWB and TWB (downstream of Chorro Creek Road) as impaired for dissolved oxygen.  The level of impairment between CAN and usTWB is unknown.  Five out of 10 samples exceeded the COLD dissolved oxygen water quality objective."
        - "SWAMP RWB3 CCAMP Coastal Confluences"
        - "SWAMP Stream Pollution Trends"
        - "public submissions"
